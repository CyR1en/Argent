# Builds Argent's disk image with scripts/build-dmg.sh --no-models and publishes it:
#   a push to main      the "nightly" pre-release, replaced each time, its image at releases/download/nightly/Argent-nightly.dmg
#   a pushed v* tag     the release of that version (v0.2.0 -> Argent 0.2.0; v0.2.0-beta.1 is marked a pre-release)
#   a pull request, or Run workflow   the image as a workflow artifact only
#
# The version comes from the tag (scripts/build-app.sh): a release is its tag's version, a nightly the newest v* tag's,
# both with the commit count as the build number. Published builds are signed with the Developer ID Application certificate
# from DEVELOPER_ID_P12 / DEVELOPER_ID_P12_PASSWORD, notarized & stapled with Apple's notary service using the
# App Store Connect API key from NOTARY_API_KEY_P8 / NOTARY_API_KEY_ID / NOTARY_API_ISSUER_ID, signed for Sparkle 2 with
# SPARKLE_ED_KEY, and published to the GitHub Pages appcast (gh-pages/appcast.xml). Pull requests from forks without
# secrets fall back to an ad-hoc, unnotarized check build. The smart masks' and Remove's models are not in Git and not in
# these images.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # macOS 27 on Apple silicon with Xcode 27 (actions/runner-images, xcode-27-arm64).
    runs-on: xcode-27
    timeout-minutes: 45
    concurrency:
      group: build-${{ github.event_name }}-${{ github.ref }}
      # A newer push to a branch replaces its build; a tag's build always finishes. Run workflow never cancels a nightly.
      cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
    env:
      # The Xcode the app is built with locally; the image's default is older.
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      SPARKLE_VERSION: 2.10.1
      SPARKLE_TARBALL_SHA256: 1a856d2a9edb8e628de88121d7be04cf0e2167f8641650b78fca00b14244cf27
    outputs:
      kind: ${{ steps.kind.outputs.kind }}
      version: ${{ steps.dmg.outputs.version }}
      artifact: ${{ steps.dmg.outputs.artifact }}
      previous_tag: ${{ steps.kind.outputs.previous_tag }}
      has_manifest: ${{ steps.sparkle.outputs.has_manifest }}
    steps:
      # The whole history and its tags: the version is the newest v* tag, the build number the commit count.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: What this run publishes
        id: kind
        run: |
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            push:refs/tags/v*)
              version=${GITHUB_REF_NAME#v}
              if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
                echo "::error::tag $GITHUB_REF_NAME is not vN.N.N or vN.N.N-suffix"; exit 1
              fi
              kind=release
              echo "ARGENT_VERSION=$version" >> "$GITHUB_ENV"
              # The release's notes start from the newest well-formed v* tag before this commit, never from nightly.
              previous=$(git -c versionsort.suffix=- tag --merged "$GITHUB_SHA^" --list 'v[0-9]*' --sort=-version:refname \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' | head -n 1)
              echo "previous_tag=$previous" >> "$GITHUB_OUTPUT"
              echo "previous release: ${previous:-none}" ;;
            push:refs/heads/main) kind=nightly ;;
            *) kind=check ;;
          esac
          channel=$([[ $kind == check ]] && echo dev || echo "$kind")
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "KIND=$kind" >> "$GITHUB_ENV"
          echo "ARGENT_CHANNEL=$channel" >> "$GITHUB_ENV"
          echo "$kind build, channel $channel"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Verify pinned mask models release
        run: python3 scripts/verify-mask-models-release.py

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      # The stock bake's NumPy, pinned by hash (bake/requirements.lock); build-dmg.sh makes dmgbuild's own venv from this Python.
      - name: Python environment
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet --disable-pip-version-check --require-hashes --only-binary :all: -r bake/requirements.lock

      # The Developer ID certificate goes into a keychain of the run's own, which codesign may use without asking.
      # Published builds (nightly and release) require Developer ID signing and notarization credentials; pull requests
      # from forks without secrets fall back to an ad-hoc, unnotarized build.
      - name: Signing and notarization credentials
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          if [[ -z $DEVELOPER_ID_P12 ]]; then
            if [[ $KIND != check ]]; then
              echo "::error::DEVELOPER_ID_P12 is not set; a $KIND build must be signed with Developer ID Application"
              exit 1
            fi
            echo "no signing secrets: ad-hoc, unnotarized"
            echo "ARGENT_SIGN_IDENTITY=-" >> "$GITHUB_ENV"
            echo "NOTARIZE=0" >> "$GITHUB_ENV"
            exit 0
          fi
          if [[ -z $DEVELOPER_ID_P12_PASSWORD ]]; then
            echo "::error::DEVELOPER_ID_P12_PASSWORD is not set"
            exit 1
          fi

          keychain=$RUNNER_TEMP/signing.keychain-db
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          (
            umask 077
            printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          )
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null

          existing_keychains=()
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line%\"}"
            line="${line#\"}"
            [[ -n $line ]] && existing_keychains+=("$line")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing_keychains[@]}"

          # Ensure Apple's Developer ID G2 intermediate is present so the trust chain validates on fresh runners.
          if ! security find-identity -v -p codesigning "$keychain" | grep -q '"Developer ID Application: '; then
            echo "Developer ID G2 intermediate missing from trust chain; installing DeveloperIDG2CA.cer"
            g2=$RUNNER_TEMP/DeveloperIDG2CA.cer
            curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$g2"
            actual=$(shasum -a 256 "$g2" | awk '{print $1}')
            expected=f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a
            if [[ $actual != "$expected" ]]; then
              echo "::error::DeveloperIDG2CA.cer SHA-256 mismatch: $actual"
              exit 1
            fi
            security import "$g2" -k "$keychain"
            rm -f "$g2"
          fi

          identity=$(scripts/sign-identity.sh)
          if [[ $identity != "Developer ID Application: "* ]]; then
            echo "::error::no valid Developer ID Application identity in signing keychain (got: $identity)"
            security find-identity -p codesigning "$keychain"
            exit 1
          fi
          echo "ARGENT_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "signing identity: $identity"

          if [[ -n $NOTARY_API_KEY_P8 && -n $NOTARY_API_KEY_ID && -n $NOTARY_API_ISSUER_ID ]]; then
            notary_key=$RUNNER_TEMP/notary.p8
            (
              umask 077
              printf '%s' "$NOTARY_API_KEY_P8" | base64 --decode > "$notary_key"
            )
            echo "ARGENT_NOTARY_KEY=$notary_key" >> "$GITHUB_ENV"
            echo "ARGENT_NOTARY_KEY_ID=$NOTARY_API_KEY_ID" >> "$GITHUB_ENV"
            echo "ARGENT_NOTARY_ISSUER=$NOTARY_API_ISSUER_ID" >> "$GITHUB_ENV"
            echo "NOTARIZE=1" >> "$GITHUB_ENV"
            echo "notarization enabled"
          elif [[ $KIND != check ]]; then
            echo "::error::NOTARY_API_KEY_P8, NOTARY_API_KEY_ID and NOTARY_API_ISSUER_ID must be set for a $KIND build"
            exit 1
          else
            echo "no notarization secrets: skipping notarization on check build"
            echo "NOTARIZE=0" >> "$GITHUB_ENV"
          fi

      - name: Build and notarize the disk image
        id: dmg
        run: |
          args=(--no-models)
          if [[ $NOTARIZE == 1 ]]; then
            args+=(--notarize)
          fi
          scripts/build-dmg.sh "${args[@]}"
          plist=build/Argent.app/Contents/Info.plist
          version=$(plutil -extract ArgentVersion raw "$plist")
          codesign -d -r- build/Argent.app
          mkdir dist
          case $KIND in
            nightly) name=Argent-nightly.dmg ;;
            *) name=Argent-$version.dmg ;;
          esac
          mv "build/Argent-$version.dmg" "dist/$name"
          (cd dist && shasum -a 256 "$name" > "$name.sha256")
          echo "DMG_NAME=$name" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact=Argent-$version-$KIND-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Sign update for Sparkle
        id: sparkle
        env:
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
        run: |
          if [[ -z $SPARKLE_ED_KEY || $NOTARIZE != 1 ]]; then
            if [[ $KIND != check ]]; then
              echo "::error::SPARKLE_ED_KEY and notarization are required for a $KIND build"
              exit 1
            fi
            echo "skipping Sparkle signature on unnotarized or secretless check build"
            echo "has_manifest=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sparkle_dir=$RUNNER_TEMP/sparkle
          mkdir -p "$sparkle_dir"
          tarball=$sparkle_dir/Sparkle-$SPARKLE_VERSION.tar.xz
          curl -fsSL "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz" -o "$tarball"
          actual=$(shasum -a 256 "$tarball" | awk '{print $1}')
          if [[ $actual != "$SPARKLE_TARBALL_SHA256" ]]; then
            echo "::error::Sparkle tarball SHA-256 mismatch: $actual"
            exit 1
          fi
          tar -xf "$tarball" -C "$sparkle_dir" bin/sign_update

          dmg_path="dist/$DMG_NAME"
          ed_sig=$(printf '%s' "$SPARKLE_ED_KEY" | "$sparkle_dir/bin/sign_update" -p --ed-key-file - "$dmg_path")
          printf '%s' "$SPARKLE_ED_KEY" | "$sparkle_dir/bin/sign_update" --verify --ed-key-file - "$dmg_path" "$ed_sig"

          plist=build/Argent.app/Contents/Info.plist
          version=$(plutil -extract ArgentVersion raw "$plist")
          build_number=$(plutil -extract CFBundleVersion raw "$plist")
          commit=$(plutil -extract ArgentCommit raw "$plist")
          min_os=$(plutil -extract LSMinimumSystemVersion raw "$plist")
          length=$(stat -f %z "$dmg_path")
          pub_date=$(LC_ALL=C date -u +"%a, %d %b %Y %H:%M:%S +0000")
          manifest_kind=$([[ $KIND == release ]] && echo release || echo nightly)

          if [[ $manifest_kind == nightly ]]; then
            channel=nightly
            short_version="$version nightly ($commit)"
            title="Nightly $(date -u +%Y-%m-%d) ($commit)"
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/nightly/Argent-nightly.dmg"
            notes_url="https://github.com/$GITHUB_REPOSITORY/releases/tag/nightly"
          else
            channel=$([[ $version == *-* ]] && echo nightly || echo stable)
            short_version=$version
            title="Argent $version"
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$version/Argent-$version.dmg"
            notes_url="https://github.com/$GITHUB_REPOSITORY/releases/tag/v$version"
          fi

          python3 - "$manifest_kind" "$version" "$short_version" "$build_number" "$commit" "$channel" \
            "$title" "$pub_date" "$min_os" "$url" "$ed_sig" "$length" "$notes_url" <<'PY' > dist/update-manifest.json
          import json, sys
          (kind, version, short_version, build_number, commit, channel,
           title, pub_date, min_os, url, ed_sig, length, notes_url) = sys.argv[1:]
          print(json.dumps({
              "kind": kind,
              "version": version,
              "short_version": short_version,
              "build_number": build_number,
              "commit": commit,
              "channel": channel,
              "title": title,
              "pub_date": pub_date,
              "min_system_version": min_os,
              "url": url,
              "ed_signature": ed_sig,
              "length": int(length),
              "release_notes_url": notes_url,
          }, indent=2))
          PY

          # Exercise update-appcast.py (manifest dir + XML rebuild) on every signed build, including PR checks.
          python3 scripts/update-appcast.py \
            --manifests-dir "$RUNNER_TEMP/test-manifests" \
            --manifest dist/update-manifest.json \
            --appcast "$RUNNER_TEMP/test-appcast.xml"
          echo "Sparkle update signed and manifest validated (channel=$channel, build=$build_number, length=$length)"
          echo "has_manifest=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.dmg.outputs.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Clean up signing and notarization credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
            "$RUNNER_TEMP/sparkle" "$RUNNER_TEMP/test-appcast.xml" "$RUNNER_TEMP/test-manifests"

  publish:
    needs: build
    if: needs.build.outputs.kind != 'check'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      # One queue a ref: nightlies publish in order, and tags pushed together each publish.
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      published: ${{ steps.nightly.outputs.published || steps.release.outputs.published || 'false' }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      KIND: ${{ needs.build.outputs.kind }}
      VERSION: ${{ needs.build.outputs.version }}
      PREVIOUS_TAG: ${{ needs.build.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: repo

      - name: Verify pinned mask models release
        run: python3 repo/scripts/verify-mask-models-release.py --repo-root repo

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      # One line a paragraph: GitHub shows a release body's line breaks. The nightly's notes are rewritten with each publish, so
      # they carry its checksum; a release's stay as first published, so its checksum is only in the .sha256 beside the image.
      - name: Release notes
        run: |
          {
            if [[ $KIND == nightly ]]; then
              echo "The newest build of \`main\`, at ${GITHUB_SHA::7} ($(date -u +%Y-%m-%d)). Every push to \`main\` replaces it."
              echo
            fi
            echo "**Install:** open the disk image and drag Argent to Applications. Signed with Developer ID and notarized by Apple."
            echo
            echo "macOS 27 on Apple silicon. The smart masks' and Remove's models are not included: Sky, Subject and Background offer the mask models as a separate download, and Remove has no model."
            if [[ $KIND == nightly ]]; then
              echo
              echo '```'
              cat dist/*.sha256
              echo '```'
            fi
          } > notes.md
          cat notes.md

      # Updated in place, so the nightly's link never goes missing: the tag is moved to this commit first, then the assets are
      # replaced and the title and notes rewritten. A run of an older commit (a re-run) leaves the nightly to main's newest.
      - name: Publish the nightly
        id: nightly
        if: env.KIND == 'nightly'
        run: |
          head=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [[ $head != "$GITHUB_SHA" ]]; then
            echo "main is at ${head::7}, not ${GITHUB_SHA::7}: its own run publishes the nightly"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/nightly" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true > /dev/null
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/nightly -f sha="$GITHUB_SHA" > /dev/null
          fi
          title="Nightly $(date -u +%Y-%m-%d) (${GITHUB_SHA::7})"
          if gh release view nightly > /dev/null 2>&1; then
            gh release upload nightly dist/*.dmg dist/*.sha256 --clobber
            gh release edit nightly --title "$title" --notes-file notes.md --prerelease --latest=false --draft=false
          else
            gh release create nightly dist/*.dmg dist/*.sha256 --verify-tag --prerelease --latest=false --title "$title" --notes-file notes.md
          fi
          tagged=$(gh api "repos/$GH_REPO/git/ref/tags/nightly" --jq .object.sha)
          if [[ $tagged != "$GITHUB_SHA" ]]; then
            echo "::error::the nightly tag is at $tagged, not $GITHUB_SHA"
            exit 1
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        id: release
        if: env.KIND == 'release'
        run: |
          tag=v$VERSION
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/*.dmg dist/*.sha256 --clobber
            gh release edit "$tag" --draft=false
          else
            args=(--verify-tag --title "Argent $VERSION" --notes-file notes.md)
            if [[ $VERSION == *-* ]]; then args+=(--prerelease); fi
            if [[ -n $PREVIOUS_TAG ]]; then args+=(--generate-notes --notes-start-tag "$PREVIOUS_TAG"); fi
            gh release create "$tag" dist/*.dmg dist/*.sha256 "${args[@]}"
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"

      # Record this release's manifest on gh-pages and deterministically rebuild appcast.xml from all stored
      # manifests. Runs inside per-ref publish (never dropped by a global concurrency queue) with fetch/reset
      # retries so simultaneous main + tag releases merge cleanly before deploy_pages publishes the site.
      - name: Record manifest and update appcast on gh-pages
        if: needs.build.outputs.has_manifest == 'true' && (steps.nightly.outputs.published == 'true' || steps.release.outputs.published == 'true')
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: pages

      - name: Commit manifest and appcast to gh-pages
        if: needs.build.outputs.has_manifest == 'true' && (steps.nightly.outputs.published == 'true' || steps.release.outputs.published == 'true')
        run: |
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin gh-pages
            git reset --hard origin/gh-pages
            python3 ../repo/scripts/update-appcast.py \
              --manifests-dir manifests \
              --manifest ../dist/update-manifest.json \
              --appcast appcast.xml
            if git status --porcelain -- manifests appcast.xml | grep -q .; then
              git add manifests appcast.xml
              git commit -m "Update appcast for $KIND $VERSION (${GITHUB_SHA::7})"
              if git push origin gh-pages; then
                exit 0
              fi
              echo "gh-pages push raced (attempt $attempt/5); retrying against updated origin/gh-pages..."
              sleep "$(( attempt * 2 ))"
            else
              echo "appcast.xml and manifests unchanged"
              exit 0
            fi
          done
          echo "::error::failed to push updated appcast to gh-pages after 5 attempts"
          exit 1

  deploy_pages:
    needs: [build, publish]
    if: needs.build.outputs.kind != 'check' && needs.build.outputs.has_manifest == 'true' && needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      # Always deploys the newest gh-pages HEAD (which already contains every committed release manifest),
      # so even if multiple queued Pages deploys coalesce, no published release is ever dropped.
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: pages

      - name: Stage public Pages files
        run: |
          mkdir -p _site
          cp pages/appcast.xml _site/appcast.xml
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        id: artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site
          include-hidden-files: true

      # Deployed with the Pages REST API, not actions/deploy-pages. That action names the deployment after GITHUB_SHA, and
      # Pages answers a build version it has seen with the earlier deployment: a release tagged on a commit whose nightly
      # already deployed reported success and left the nightly's appcast up (v0.2.0). The gh-pages commit names the
      # deployment instead, and it changes with every appcast change. The artifact's ID comes from upload-pages-artifact,
      # so nothing is looked up through the Actions Results API, whose lag after an upload (actions/deploy-pages#451)
      # needed retries.
      - name: Deploy to GitHub Pages
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        run: |
          if [[ -z $ARTIFACT_ID ]]; then
            echo "::error::upload-pages-artifact gave no artifact_id"
            exit 1
          fi
          if [[ -z ${ACTIONS_ID_TOKEN_REQUEST_URL:-} || -z ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-} ]]; then
            echo "::error::no OIDC token request URL; the job needs id-token: write"
            exit 1
          fi
          version=$(git -C pages rev-parse HEAD)
          # Transient failures are retried, as actions/deploy-pages's toolkit does for the token and #33's steps did for the request.
          oidc=$(curl -fsS --connect-timeout 15 --max-time 60 --retry 5 --retry-delay 2 --retry-all-errors \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          if [[ -z $oidc || $oidc == null ]]; then
            echo "::error::no OIDC token in the runner's response"
            exit 1
          fi
          echo "::add-mask::$oidc"

          # A repeated request names the same build version, so one Pages accepted before failing to answer is not deployed twice.
          body=$(jq -n --argjson artifact "$ARTIFACT_ID" --arg version "$version" --arg oidc "$oidc" \
            '{artifact_id: $artifact, pages_build_version: $version, oidc_token: $oidc, environment: "github-pages"}')
          for attempt in 1 2 3; do
            if created=$(gh api -X POST "repos/$GH_REPO/pages/deployments" --input - <<< "$body"); then
              break
            fi
            if (( attempt == 3 )); then
              echo "::error::could not create the Pages deployment"
              exit 1
            fi
            echo "creating the deployment failed (attempt $attempt/3); retrying"
            sleep $(( attempt * 10 ))
          done
          id=$(jq -r '(.id // (.status_url // "" | split("/") | last)) | tostring' <<< "$created")
          [[ -n $id && $id != null ]] || id=$version
          echo "page_url=$(jq -r '.page_url // empty' <<< "$created")" >> "$GITHUB_OUTPUT"
          echo "deploying gh-pages ${version::7} (artifact $ARTIFACT_ID) as deployment $id"

          # The deployment's own 10-minute limit, as actions/deploy-pages gives it; a transient API error is retried.
          deadline=$(( SECONDS + 600 ))
          interval=5
          errors=0
          while (( SECONDS < deadline )); do
            sleep "$interval"
            # Backs off on a failed read too, so a brief API outage doesn't use up the error budget in under a minute.
            interval=$(( interval * 3 / 2 > 30 ? 30 : interval * 3 / 2 ))
            if ! status=$(gh api "repos/$GH_REPO/pages/deployments/$id" --jq .status); then
              (( ++errors < 10 )) && continue
              echo "::error::could not read deployment $id's status"
              gh api -X POST "repos/$GH_REPO/pages/deployments/$id/cancel" > /dev/null || true
              exit 1
            fi
            case $status in
              succeed) echo "deployed gh-pages ${version::7}"; exit 0 ;;
              deployment_failed|deployment_content_failed|deployment_cancelled|deployment_lost)
                echo "::error::Pages deployment $id ended with $status"
                exit 1 ;;
              *) echo "status: $status" ;;
            esac
          done
          gh api -X POST "repos/$GH_REPO/pages/deployments/$id/cancel" > /dev/null || true
          echo "::error::Pages deployment $id did not finish in 10 minutes; cancelled"
          exit 1
