<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Argent — Settings page</title>
<style>
  :root {
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    --mono: "SF Mono", ui-monospace, Menlo, monospace;
  }
  :root { color-scheme: light dark; }
  html, body { margin: 0; }

  /* Outside the window: the mockup's own caption, in the host's colours. */
  .sim { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 10px;
         font: 12px/1.3 var(--font-sans, var(--sans)); color: var(--muted-foreground, GrayText); }
  .sim b { font-weight: 600; color: var(--foreground, CanvasText); margin-right: 6px; }
  .sim div { display: flex; gap: 4px; }
  .sim button { all: unset; cursor: pointer; padding: 3px 8px; border-radius: 6px; font-size: 11px;
                border: 1px solid transparent; font-variant-numeric: tabular-nums; }
  .sim button:hover { color: var(--foreground, CanvasText); }
  .sim button[aria-pressed=true] { background: var(--secondary, rgba(128,128,128,.16)); color: var(--foreground, CanvasText);
                                   border-color: var(--border, rgba(128,128,128,.25)); }
  .sim button:focus-visible { outline: 2px solid var(--ring, #888); outline-offset: 1px; }
  .stage { position: relative; width: 100%; }

  /* ── The window ─────────────────────────────────────────────────────────────── */
  .win, .mini { display: grid; grid-template-rows: 52px minmax(0, 1fr); isolation: isolate; overflow: hidden;
                font-family: var(--sans); font-size: 13px; line-height: 1.25; color: var(--text);
                -webkit-font-smoothing: antialiased; cursor: default; user-select: none; -webkit-user-select: none; }
  .win { position: absolute; left: 0; top: 0; transform-origin: 0 0; grid-template-columns: 60px minmax(0, 1fr);
         border-radius: 16px; box-shadow: 0 0 0 .5px rgba(128,128,128,.45), 0 2px 7px rgba(0,0,0,.22); }
  .win *, .mini * { box-sizing: border-box; }
  .win, .win * { transition: background-color .18s ease-out, color .18s ease-out, box-shadow .18s ease-out; }

  /* The shell: the Mac's sidebar material under the theme's tint. */
  .shell { position: absolute; inset: 0; z-index: -1; }
  .shell i { position: absolute; inset: 0; }
  .shell .desk { background:
      radial-gradient(ellipse 46% 60% at 6% 18%, #46506a 0, transparent 70%),
      radial-gradient(ellipse 40% 50% at 96% 8%, #4d4560 0, transparent 70%),
      radial-gradient(ellipse 60% 44% at 60% 104%, #5a4a44 0, transparent 72%),
      radial-gradient(ellipse 30% 50% at 0% 92%, #3b4d50 0, transparent 70%),
      #33363f; }
  .shell .mat { background: var(--mat); }
  .shell .tint { background: var(--tint); opacity: var(--tint-a); }

  .strip { grid-column: 1 / -1; position: relative; display: flex; align-items: center; color: rgb(var(--ink)); }
  .lights { position: absolute; left: 20px; display: flex; gap: 8px; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.2); }
  .lights i:nth-child(1) { background: #ff5f57; } .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
  .lights.idle i { background: rgba(var(--ink), .22); box-shadow: none; }
  .wordmark { position: absolute; left: 94px; font-size: 19px; }
  .ctx { position: absolute; left: 0; right: 0; text-align: center; }
  .ctx b { display: block; font-size: 13px; font-weight: 600; }
  .ctx em { display: block; font-style: normal; font-size: 11px; margin-top: 1px; opacity: .96; font-variant-numeric: tabular-nums; }

  .rail { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding-bottom: 6px; }
  .rail a { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: rgba(var(--ink), .96); }
  .rail a.dim { opacity: .38; }
  .rail a.here { color: rgb(var(--ink)); background: var(--lens); box-shadow: var(--glass-edge), 0 1px 5px rgba(0,0,0,.16); }
  .rail hr { width: 20px; height: 1px; border: 0; margin: 4px 0; background: rgba(var(--ink), .09); }
  svg.ic { display: block; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  .ws { position: relative; margin: 0 6px 6px 0; border-radius: 16px; background: var(--ws); overflow: hidden; min-height: 0; }
  .page { height: 100%; overflow-y: auto; scrollbar-width: thin; scrollbar-color: rgba(var(--ink), .25) transparent; }
  .col { max-width: 720px; margin: 0 auto; padding: 36px 44px 40px; box-sizing: content-box !important; }

  /* ── Shared parts (Graphite.swift) ──────────────────────────────────────────── */
  .glass { background: var(--glass-bg); box-shadow: var(--glass-edge), 0 1px 3px rgba(0,0,0,.07); }
  .btn { all: unset; height: 28px; padding: 0 10px; border-radius: 7px; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; color: var(--text); }
  .btn.icon { width: 28px; padding: 0; justify-content: center; }
  .btn.glass { background: var(--glass-bg); box-shadow: var(--glass-edge), 0 1px 3px rgba(0,0,0,.07); }
  .btn:hover { background-color: rgba(var(--ink), .09); }
  .btn:active { background-color: rgba(var(--ink), .14); }
  .quiet { all: unset; font-size: 11px; padding: 0 5px; height: 18px; line-height: 18px; border-radius: 5px; color: var(--sec); }
  .quiet:hover { color: var(--text); background: rgba(var(--ink), .09); }
  .win :focus-visible { outline: 2px solid var(--selection); outline-offset: 2px; }

  .seg { position: relative; display: flex; padding: 2px; border-radius: 8px; }
  .seg .thumb { position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc((100% - 4px) / var(--n)); border-radius: 6px;
                background: var(--thumb); box-shadow: 0 .5px 1.5px rgba(0,0,0,.22); transform: translateX(calc(var(--i) * 100%));
                transition: transform .34s cubic-bezier(.3, 1.35, .5, 1); }
  .seg button { all: unset; position: relative; flex: 1; height: 30px; border-radius: 6px; display: flex; align-items: center;
                justify-content: center; gap: 6px; font-size: 13px; color: var(--sec); }
  .seg button:hover, .seg button[aria-pressed=true] { color: var(--text); }
  .pseg { display: inline-flex; padding: 2px; border-radius: 8px; }
  .pseg span { height: 24px; padding: 0 14px; display: flex; align-items: center; gap: 5px; border-radius: 6px; color: var(--sec); white-space: nowrap; }
  .pseg span.on { background: var(--thumb); color: var(--text); box-shadow: 0 .5px 1.5px rgba(0,0,0,.22); }
  .pseg.fill { display: flex; } .pseg.fill span { flex: 1; justify-content: center; padding: 0; }

  .face { height: 28px; padding: 0 10px 0 12px; border-radius: 7px; display: flex; align-items: center; justify-content: space-between;
          background: rgba(var(--ink), .05); box-shadow: inset 0 0 0 1px rgba(var(--ink), .12); }
  .face svg { color: var(--sec); }
  .qc { display: flex; align-items: center; height: 28px; border-radius: 7px; background: rgba(var(--ink), .05);
        box-shadow: inset 0 0 0 1px rgba(var(--ink), .12); }
  .qc output, .qc b { flex: none; width: 54px; height: 100%; display: grid; place-items: center; font-weight: 400;
                      font-variant-numeric: tabular-nums; border-right: 1px solid rgba(var(--ink), .12); }
  .qc input { -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 100%; margin: 0 12px; background: none; cursor: default; }
  .qc input::-webkit-slider-runnable-track { height: 4px; border-radius: 2px;
        background: linear-gradient(90deg, var(--text) var(--p), rgba(var(--ink), .2) var(--p)); }
  .qc input::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 14px; margin-top: -5px; border-radius: 7px; background: #fff;
        box-shadow: 0 0 0 .5px rgba(0,0,0,.14), 0 1px 2.5px rgba(0,0,0,.34); transition: transform .2s cubic-bezier(.3, 1.4, .5, 1); }
  .qc input:active::-webkit-slider-thumb { transform: scale(1.12); }
  .qc input:focus-visible { outline: none; } .qc:has(input:focus-visible) { outline: 2px solid var(--selection); outline-offset: 2px; }
  .qc .trk { position: relative; flex: 1; height: 4px; margin: 0 12px; border-radius: 2px; background: rgba(var(--ink), .2); }
  .qc .trk i { position: absolute; left: 0; top: 0; bottom: 0; width: 84%; border-radius: 2px; background: var(--text); }
  .qc .trk s { position: absolute; left: 84%; top: -5px; width: 22px; height: 14px; margin-left: -11px; border-radius: 7px; background: #fff; box-shadow: 0 1px 2.5px rgba(0,0,0,.34); }
  .off { opacity: .42; pointer-events: none; }

  .sw { all: unset; flex: none; position: relative; width: 30px; height: 18px; border-radius: 9px; background: rgba(var(--ink), .2); }
  .sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--text);
               box-shadow: 0 .5px 1px rgba(0,0,0,.3); transition: transform .22s cubic-bezier(.3, 1.4, .5, 1), background-color .15s; }
  .sw.off { opacity: .42; pointer-events: none; }
  .sw[aria-checked=true] { background: var(--selection); }
  .sw[aria-checked=true]::after { transform: translateX(12px); background: var(--onp); }

  .pill { font-size: 10px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; padding: 2px 6px; border-radius: 5px; background: rgba(var(--ink), .14); }
  .chip { all: unset; height: 20px; padding: 0 6px 0 7px; border-radius: 6px; display: inline-flex; align-items: center; gap: 3px; font-size: 12px; background: rgba(var(--ink), .07); }
  .chip:hover, .chip[aria-expanded=true] { background: rgba(var(--ink), .12); }
  .chip svg { color: var(--sec); }
  .menu { position: absolute; z-index: 9; left: 16px; top: calc(100% + 4px); min-width: 148px; padding: 5px; border-radius: 10px; background: var(--menu-bg);
          -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); box-shadow: 0 0 0 .5px rgba(var(--ink), .2), 0 12px 32px rgba(0,0,0,.32); }
  .menu button { all: unset; display: flex; align-items: center; width: 100%; height: 24px; padding: 0 12px 0 24px; border-radius: 6px; font-size: 13px; position: relative; }
  .menu button:hover, .menu button:focus-visible { background: rgba(var(--ink), .1); outline: none; }
  .menu button[aria-checked=true]::before { content: ""; position: absolute; left: 9px; top: 7px; width: 8px; height: 4.5px;
          border-left: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); }

  /* ── The page ───────────────────────────────────────────────────────────────── */
  h1 { margin: 0; font-size: 26px; font-weight: 600; line-height: 1.15; }
  .sub { margin-top: 6px; color: var(--sec); }
  .close { position: absolute; top: 18px; right: 18px; z-index: 2; }

  .sect { display: flex; align-items: center; gap: 12px; height: 20px; margin: 30px 0 14px; }
  .sect b { font-size: 11px; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase; color: var(--ter); }
  .sect i { flex: 1; height: 1px; background: rgba(var(--ink), .09); }
  .sect .quiet[hidden] { display: none; }

  .line { display: flex; align-items: center; gap: 12px; min-height: 34px; }
  .line .name { font-size: 15px; }
  .line .note { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--sec); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .line .seg { width: 312px; flex: none; margin-left: auto; }

  /* The two proofs: the theme's light version and its dark one, as the window would be. */
  .proofs { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 14px; }
  .proof { position: relative; min-width: 0; }
  .proof > button { all: unset; display: block; width: 100%; border-radius: 10px; }
  .frame { position: relative; display: block; aspect-ratio: 760 / 452; border-radius: 10px; overflow: hidden; background: var(--well);
           box-shadow: 0 0 0 1px rgba(var(--ink), .12), 0 4px 14px rgba(0,0,0,.12); transition: box-shadow .2s ease-out; }
  .proof.shown .frame { box-shadow: 0 0 0 2px var(--ws), 0 0 0 4px var(--selection), 0 6px 18px rgba(0,0,0,.16); }
  .proof > button:hover .frame { filter: brightness(1.03); }
  .proof > button:focus-visible { outline-offset: 5px; }
  .cap { display: flex; align-items: center; gap: 6px; height: 20px; margin: 12px 2px 0; color: var(--sec); }
  .proof.shown .cap { color: var(--text); }
  .cap .pill { margin-left: auto; color: var(--text); }
  .none { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
          text-align: center; padding: 0 28px; border-radius: 10px; color: var(--sec);
          background: repeating-linear-gradient(135deg, rgba(var(--ink), .035) 0 6px, transparent 6px 12px); box-shadow: inset 0 0 0 1px rgba(var(--ink), .12); }
  .none b { font-size: 13px; font-weight: 600; color: var(--text); }
  .none span { font-size: 12px; }

  .mini { position: absolute; left: 0; top: 0; width: 760px; height: 452px; transform-origin: 0 0; transform: scale(var(--k, .46));
          grid-template-columns: 60px minmax(0, 1fr) 304px; pointer-events: none; transition: none; }
  .mini * { transition: none !important; }
  .mini .shell .mat { background: var(--mini-mat); }
  .m-ws { margin: 0 0 6px; border-radius: 16px; background: var(--ws); padding: 14px 18px 0; overflow: hidden; }
  .m-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 12px; margin-top: 14px; }
  .m-grid em { display: block; font-style: normal; font-size: 11px; color: var(--sec); margin-top: 5px; text-align: center; font-variant-numeric: tabular-nums; }
  .pic { position: relative; display: block; aspect-ratio: 3 / 2; border-radius: 4px; background-color: var(--well); }
  .sel .pic { box-shadow: 0 0 0 2px var(--ws), 0 0 0 4px var(--selection); }
  .sel em { color: var(--text); }
  .pic u { position: absolute; right: 5px; bottom: 5px; width: 15px; height: 15px; border-radius: 50%; background: rgba(0,0,0,.6); box-shadow: 0 0 0 1px rgba(255,255,255,.3); }
  .pic u::after { content: ""; position: absolute; left: 4.2px; top: 4.6px; width: 6px; height: 3.2px; border-left: 1.3px solid #fff; border-bottom: 1.3px solid #fff; transform: rotate(-45deg); }
  .m-panel { margin: 0 12px 6px; border-radius: 16px; padding: 18px 20px 20px; display: flex; flex-direction: column;
             background: color-mix(in srgb, var(--float) 82%, transparent); box-shadow: var(--glass-edge), 0 6px 20px rgba(0,0,0,.14); }
  .m-panel h2 { margin: 0; font-size: 19px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  .m-panel h2 svg { color: var(--sec); }
  .m-panel p { margin: 4px 0 0; color: var(--sec); }
  .m-panel hr { border: 0; height: 1px; margin: 13px 0; background: rgba(var(--ink), .09); }
  .m-panel small { font-size: 12px; color: var(--sec); }
  .m-panel .folder { height: 36px; margin-top: 8px; padding: 0 12px; gap: 10px; justify-content: flex-start; border-radius: 8px; }
  .p-row { display: grid; grid-template-columns: 78px 1fr; align-items: center; margin-bottom: 10px; }
  .m-panel .go { margin-top: auto; height: 36px; border-radius: 8px; display: grid; place-items: center; font-size: 15px; font-weight: 600; color: var(--onp);
                 background: linear-gradient(var(--ptop), var(--pbot)); box-shadow: inset 0 .5px 0 rgba(255,255,255,.4), 0 1px 3px rgba(0,0,0,.25); }

  /* Stand-ins for a roll's first frames. */
  .f1 { background-image: radial-gradient(ellipse 36% 26% at 66% 50%, rgba(255,222,184,.55) 0, transparent 72%), linear-gradient(180deg, #66768c 0, #a99d96 44%, #d2ae8c 55%, #47515c 56.5%, #2c343c 100%); }
  .f2 { background-image: radial-gradient(ellipse 15% 46% at 18% 88%, #222d27 0 50%, transparent 66%), radial-gradient(ellipse 13% 38% at 43% 92%, #2a362f 0 50%, transparent 66%), radial-gradient(ellipse 17% 52% at 80% 90%, #1f2924 0 50%, transparent 66%), linear-gradient(180deg, #c5c9c5 0, #a4ada8 48%, #647268 72%, #2f3a33 100%); }
  .f3 { background-image: radial-gradient(ellipse 9% 14% at 46% 40%, #2b2523 0 62%, transparent 80%), radial-gradient(ellipse 22% 44% at 46% 98%, #2e292b 0 64%, transparent 80%), radial-gradient(ellipse 70% 90% at 30% 30%, rgba(255,236,210,.22) 0, transparent 70%), linear-gradient(100deg, #b79d84 0, #8c715a 100%); }
  .f4 { background-image: radial-gradient(ellipse 30% 34% at 24% 36%, #8a9a66 0, transparent 72%), radial-gradient(ellipse 34% 40% at 70% 56%, #3d5030 0, transparent 70%), radial-gradient(ellipse 22% 26% at 58% 22%, #a7ad70 0, transparent 70%), linear-gradient(180deg, #b9c2b4 0, #6d8052 30%, #4c5f3a 100%); }
  .f5 { background-image: radial-gradient(circle at 28% 56%, rgba(255,196,130,.7) 0 2.5%, transparent 9%), radial-gradient(circle at 54% 48%, rgba(170,200,235,.55) 0 2%, transparent 8%), radial-gradient(circle at 74% 60%, rgba(255,170,120,.55) 0 3%, transparent 11%), linear-gradient(180deg, #171d2a 0, #232a38 54%, #0e1117 100%); }
  .f6 { background-image: linear-gradient(180deg, #cdd3d9 0, #e6e9eb 42%, #8d979c 46%, #6f7a80 48.5%, #cfd5d9 50%, #e3e6e8 100%); }
  .f7 { background-image: linear-gradient(180deg, transparent 50%, #ad8c62 50.5%, #86663f 100%), radial-gradient(ellipse 44% 20% at 30% 51%, #75788a 0 55%, transparent 70%), linear-gradient(180deg, #86a8c2 0, #c4cfcf 50%); }
  .f8 { background-image: radial-gradient(ellipse 26% 40% at 64% 42%, #ecdfc8 0, rgba(236,223,200,.5) 42%, transparent 82%), linear-gradient(120deg, #3a332d 0, #1f1c1a 100%); }
  .f9 { background-image: radial-gradient(ellipse 80% 80% at 50% 40%, transparent 55%, rgba(0,0,0,.2) 100%), linear-gradient(180deg, #c3d1d8 0, #dbe2e0 49%, #5d7c84 50.5%, #3c5862 100%); }

  /* The themes. */
  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
  .tile { all: unset; position: relative; display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 12px; border-radius: 12px;
          background: rgba(var(--ink), .05); box-shadow: inset 0 0 0 1px rgba(var(--ink), .12); }
  .tile:hover { background: rgba(var(--ink), .08); }
  .tile:active { transform: scale(.985); }
  .tile[aria-pressed=true] { box-shadow: inset 0 0 0 1.5px var(--text); }
  .tile .txt { min-width: 0; flex: 1; }
  .tile .txt > span { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .tile .txt b, .tile .txt em { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .txt b { font-weight: 400; } .tile[aria-pressed=true] .txt b { font-weight: 600; }
  .tile .txt em { font-style: normal; font-size: 11px; color: var(--sec); }
  .tile .txt span + span { margin-top: 3px; }
  .tile .txt u[hidden] { display: none; }
  .tile .txt u { flex: none; text-decoration: none; font-size: 11px; font-variant-numeric: tabular-nums; padding: 0 4px; border-radius: 4px; background: rgba(var(--ink), .09); }
  .tile .txt svg { display: none; } .tile[aria-pressed=true] .txt svg { display: block; }
  /* The theme's two versions side by side, as the proofs are: each its workspace, its ink and its primary colour. */
  .swatch { flex: none; display: flex; width: 52px; height: 34px; border-radius: 5px; overflow: hidden; box-shadow: 0 0 0 1px rgba(128,128,128,.42); }
  .swatch i { position: relative; flex: 1; background: var(--b); }
  .swatch i::before { content: ""; position: absolute; left: 5px; top: 7px; width: 12px; height: 2px; border-radius: 1px; background: var(--t);
                      box-shadow: 0 5px 0 -0.01px color-mix(in srgb, var(--t) 50%, var(--b)); }
  .swatch i::after { content: ""; position: absolute; left: 5px; bottom: 6px; width: 14px; height: 6px; border-radius: 3px; background: var(--p); }

  .foot { display: flex; align-items: center; gap: 7px; margin-top: 12px; font-size: 12px; color: var(--ter); }

  /* Cards of rows. */
  .card { position: relative; border-radius: 12px; overflow: hidden; }
  .row { position: relative; display: flex; align-items: center; gap: 20px; min-height: 62px; padding: 10px 20px; }
  .row + .row { border-top: 1px solid rgba(var(--ink), .09); }
  .row .lab { flex: none; width: 262px; min-width: 0; }
  .row .lab b { display: block; font-size: 15px; font-weight: 400; }
  .row .lab em { display: block; font-style: normal; font-size: 12px; color: var(--sec); margin-top: 3px; }
  .row .qc { flex: 1; min-width: 0; }
  .row.wide .lab { flex: 1; width: auto; }
  /* The Frame view card: a frame on its surround, as the frame view has it, beside the rows that set it. */
  .fv { display: grid; grid-template-columns: 34% minmax(0, 1fr); }
  .spec { position: relative; overflow: hidden; background: var(--surround); border-right: 1px solid rgba(var(--ink), .09); }
  .spec .amb { position: absolute; inset: -36px; filter: var(--amb-filter); opacity: var(--amb, 0); transition: opacity .3s ease-out;
               -webkit-mask-image: radial-gradient(ellipse 72% 72% at 50% 50%, #000 34%, rgba(0,0,0,.55) 100%); mask-image: radial-gradient(ellipse 72% 72% at 50% 50%, #000 34%, rgba(0,0,0,.55) 100%); }
  .spec .shot { position: absolute; left: 50%; top: 50%; height: 78%; aspect-ratio: 2 / 3; transform: translate(-50%, -50%); transition: box-shadow .3s ease-out; }
  .spec.shadow .shot { box-shadow: 0 1px 2px rgba(0,0,0,.26), 0 7px 20px rgba(0,0,0,.34); }
  .fp { background-image: radial-gradient(ellipse 7% 4.6% at 52% 57%, #1b1d24 0 58%, transparent 88%), radial-gradient(ellipse 12% 13% at 52% 71%, #1e222c 0 60%, transparent 84%),
        radial-gradient(ellipse 8% 11% at 52% 87%, #33291f 0 50%, transparent 82%), radial-gradient(ellipse 80% 26% at 62% 28%, rgba(255,255,255,.34) 0, transparent 72%),
        linear-gradient(180deg, #5b7aa6 0, #9db2c8 45%, #c9c4b5 59%, #8c7656 65%, #5f4b37 82%, #3a2e23 100%); }
  .fv .row .lab { flex: 1; width: auto; }

// ── Colour, as ThemePalette has it ──────────────────────────────────────────────

    } else ver.textContent = v ? v.title : 'None';
  }
  $('#modeNote').innerHTML = S.mode === 'system' ? `Follows the Mac, ${mac.matches ? 'dark' : 'light'} now` : '';

  // The themes.
  tiles.querySelectorAll('.tile').forEach(tile => {
    const t = themeOf(tile.dataset.theme), d = derive(darkOf(t)), l = t.light && derive(t.light);
    tile.setAttribute('aria-pressed', t.id === th.id);
    const half = p => `<i style="--b:${hex(p.ws)};--t:${hex(p.text)};--p:${hex(p.bot)}"></i>`;
    tile.querySelector('.swatch').innerHTML = (l ? half(l) : '') + half(d);
    tile.querySelector('em').textContent = l ? `${l.title} · ${d.title}` : d.title;
    const more = tile.querySelector('u');
    more.hidden = t.dark.length < 2;
    more.textContent = `+${t.dark.length - 1}`;
    more.title = `${t.dark.length} dark versions: ${t.dark.map(v => v.title).join(', ')}`;
  });

  // The window shell.
  for (const k of ['t', 's', 'ai']) {
    const input = $('#' + k);
    input.value = S[k];
    input.style.setProperty('--p', (S[k] - input.min) / (input.max - input.min) * 100 + '%');
    $(`#${k}Out`).textContent = S[k] + '%';
  }
  $('#sRow').querySelector('.qc').classList.toggle('off', sh.control !== 'available');
  $('#sNote').textContent = { available: 'At 100%, the tint matches the theme', neutral: `${th.name}’s tint has no color to adjust`,
                              transparent: 'Lower transparency to show the tint' }[sh.control];
  $('#resetShell').hidden = S.t === DEFAULTS.t && S.s === DEFAULTS.s;

  // The frame view's surround.
  const ambient = S.amb && !firm.matches;
  $('#surround').style.setProperty('--i', S.amb ? 0 : 1);
  $('#surround').classList.toggle('off', firm.matches);
  win.querySelectorAll('#surround button').forEach(b => b.setAttribute('aria-pressed', (b.dataset.surround === '1') === S.amb));
  $('#surNote').textContent = firm.matches ? 'Increase Contrast keeps the surround neutral'
    : S.amb ? 'Colors from the open frame' : 'Flat gray in every theme';
  $('#aiBox').classList.toggle('off', !ambient);
  $('#shadowSw').classList.toggle('off', !ambient);
  $('#shadowSw').setAttribute('aria-checked', S.shadow);
  $('#spec').style.setProperty('--amb', ambient ? (S.ai / 100 * .82).toFixed(3) : 0);
  $('#spec').classList.toggle('shadow', ambient && S.shadow);
  $('#frameNote').textContent = `View › Gray Surround (⇧⌘G) ${ambient ? 'always ' : ''}switches to 18% gray for proofing`;
  $('#resetFrame').hidden = S.amb === FRAME.amb && S.ai === FRAME.ai && S.shadow === FRAME.shadow;

  $('#grainSw').setAttribute('aria-checked', S.grain);
  $('#grain').classList.toggle('out', !S.grain);
  grain.palette = derive(version);
  grain.wake();
  layout();
}

// ── Events ──────────────────────────────────────────────────────────────────────
function closeMenu() { win.querySelector('.menu')?.remove(); win.querySelector('.chip')?.setAttribute('aria-expanded', false); }
win.addEventListener('click', e => {
  const hit = s => e.target.closest(s);
  const item = hit('.menu button');
  if (item) { S.dv[S.theme] = item.dataset.v; closeMenu(); return render(); }
  const chip = hit('.chip');
  if (chip) {
    if (win.querySelector('.menu')) return closeMenu();
    const th = themeOf(S.theme), now = darkOf(th);
    chip.setAttribute('aria-expanded', true);
    chip.closest('.proof').insertAdjacentHTML('beforeend', `<div class="menu" role="menu">${th.dark.map(v =>
      `<button role="menuitemradio" aria-checked="${v === now}" data-v="${v.id}">${v.title}</button>`).join('')}</div>`);
    return win.querySelector('.menu [aria-checked=true]').focus();
  }
  closeMenu();
  const mode = hit('[data-mode]'), tile = hit('.tile'), surround = hit('[data-surround]');
  if (mode) S.mode = mode.dataset.mode;
  else if (tile) S.theme = tile.dataset.theme;
  else if (surround) S.amb = surround.dataset.surround === '1';
  else if (hit('#shadowSw')) S.shadow = !S.shadow;
  else if (hit('#resetFrame')) Object.assign(S, FRAME);
  else if (hit('#grainSw')) S.grain = !S.grain;
  else if (hit('#resetShell')) Object.assign(S, DEFAULTS);
  else return;
  render();
});
win.addEventListener('keydown', e => {
  const menu = win.querySelector('.menu');
  if (!menu) return;
  const items = [...menu.children], at = items.indexOf(document.activeElement);
  if (e.key === 'Escape') { closeMenu(); win.querySelector('.chip')?.focus(); }
  else if (e.key === 'ArrowDown') items[(at + 1) % items.length].focus();
  else if (e.key === 'ArrowUp') items[(at + items.length - 1) % items.length].focus();
  else return;
  e.preventDefault();
});
for (const k of ['t', 's', 'ai']) $('#' + k).addEventListener('input', e => { S[k] = +e.target.value; render(); });
mac.addEventListener('change', render);
firm.addEventListener('change', render);
document.querySelectorAll('.sim button').forEach(b => b.addEventListener('click', () => {
  S.size = b.dataset.size;
  document.querySelectorAll('.sim button').forEach(o => o.setAttribute('aria-pressed', o === b));
  layout();
}));

// ── The window's size in the mockup's frame ─────────────────────────────────────
function layout() {
  const room = stage.clientWidth;
  if (!room) return;
  const fixed = { std: [1280, 860], min: [800, 560] }[S.size];
  const width = fixed ? fixed[0] : Math.min(1280, Math.max(874, room)), k = Math.min(1, room / width);
  win.style.width = width + 'px';
  win.style.height = fixed ? fixed[1] + 'px' : 'auto';
  win.style.transform = `scale(${k})`;
  win.style.left = Math.max(0, (room - width * k) / 2) + 'px';
  stage.style.height = Math.ceil(win.offsetHeight * k) + 'px';
  win.querySelectorAll('.frame').forEach(f => f.style.setProperty('--k', f.clientWidth / 760));
}
let lastRoom = 0;
new ResizeObserver(() => { if (stage.clientWidth !== lastRoom) { lastRoom = stage.clientWidth; layout(); } }).observe(stage);

// ── The Latent image, small: 2-point cells lit against Bayer's 8 by 8 matrix ────
const grain = (() => {
  const B = [0,32,8,40,2,34,10,42, 48,16,56,24,50,18,58,26, 12,44,4,36,14,46,6,38, 60,28,52,20,62,30,54,22,
             3,35,11,43,1,33,9,41, 51,19,59,27,49,17,57,25, 15,47,7,39,13,45,5,37, 63,31,55,23,61,29,53,21];
  const canvas = $('#grain'), card = $('#rollsCard'), g = canvas.getContext('2d');
  const self = { palette: null, wake };
  let pointer = null, pool = 0, running = false, last = 0;
  const hash = (x, y) => { const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return n - Math.floor(n); };
  const smooth = t => t * t * (3 - 2 * t);
  function noise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), u = smooth(x - xi), v = smooth(y - yi);
    return (hash(xi, yi) * (1 - u) + hash(xi + 1, yi) * u) * (1 - v) + (hash(xi, yi + 1) * (1 - u) + hash(xi + 1, yi + 1) * u) * v;
  }
  function draw(time) {
    const w = Math.ceil(card.clientWidth / 2), h = Math.ceil(card.clientHeight / 2), p = self.palette;
    if (!w || !h || !p) return;
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    const image = g.createImageData(w, h), data = image.data, t = time / 1000;
    const lit = [ch(p.text, 16), ch(p.text, 8), ch(p.text, 0), Math.round((p.dark ? .2 : .16) * 255)];
    const warm = mix(p.text, p.bot, .7), near = [ch(warm, 16), ch(warm, 8), ch(warm, 0), Math.round(.42 * 255)];
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      let cover = .05 + .3 * noise(x / 46 + t * .11, y / 30 - t * .05) * noise(x / 19 - t * .07, y / 15 + 7);
      let ink = lit;
      if (pool > .01 && pointer) {
        const d = Math.hypot(x - pointer.x, y - pointer.y) / 26;
        if (d < 1) { cover += pool * .55 * (1 - d) * (1 - d); ink = near; }
      }
      if (cover > (B[(y & 7) * 8 + (x & 7)] + .5) / 64) data.set(ink, (y * w + x) * 4);
    }
    g.putImageData(image, 0, 0);
  }
  function tick(time) {
    if (!running) return;
    if (time - last > 66) { last = time; pool += ((pointer ? 1 : 0) - pool) * .25; draw(time); }
    if (!S.grain || still.matches) { running = false; return; }
    requestAnimationFrame(tick);
  }
  function wake() {
    if (still.matches || !S.grain) return draw(4200);
    if (!running) { running = true; requestAnimationFrame(tick); }
  }
  card.addEventListener('pointermove', e => {
    const box = card.getBoundingClientRect(), k = box.width / card.clientWidth || 1;
    pointer = { x: (e.clientX - box.left) / k / 2, y: (e.clientY - box.top) / k / 2 };
  });
  card.addEventListener('pointerleave', () => pointer = null);
  return self;
})();

render();
</script>
